<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enter PIN Code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
input:focus{outline:none}
</style>
</helmet>
<div style="width: 390px; height: 660px; box-sizing: border-box; background: #ffffff; font-family: 'Inter', system-ui, sans-serif; color: #3a3c48; display: flex; flex-direction: column; align-items: center; padding-top: 96px">

<h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 700; color: #2f3140">Welcome back!</h1>
<p style="margin: 14px 0 0; max-width: 270px; text-align: center; font-size: 15px; line-height: 23px; font-weight: 700; color: #555459">Please enter the PIN-Code</p>

<div style="position: relative; margin-top: 36px; width: 290px; height: 56px; box-sizing: border-box; border: 1px solid {{ boxBorder }}; border-radius: 10px">
<label for="pin" style="position: absolute; top: -10px; left: 11px; padding: 0 6px; background: #ffffff; font-size: 13px; color: #9a9ba3">Code</label>
<input id="pin" type="text" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit code…" value="{{ code }}" onChange="{{ onCodeChange }}" style="width: 100%; height: 100%; box-sizing: border-box; padding: 0 17px; background: transparent; border: 0; color: #3a3c48; font-family: inherit; font-size: 15.5px"/>
</div>

<p style="margin: 21px 0 0; text-align: center; font-size: 14.5px; line-height: 20px; font-weight: 400; color: #555459">Enter 6-digit pin code</p>

<a href="{{ nextHref }}" onClick="{{ onSubmit }}" style="margin-top: 22px; width: 290px; height: 56px; box-sizing: border-box; text-decoration: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; border-radius: 12px; background: #0d6ed5; box-shadow: 0 10px 22px rgba(13, 110, 213, 0.3)">
<span style="font-size: 17px; font-weight: 700; color: #ffffff">Sign in</span>
<span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(255, 255, 255, 0.28); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>
</a>

<a href="Login.dc.html" style="margin-top: 21px; font-size: 14.5px; font-weight: 500; color: #0d6ed5; text-decoration: none">Go back</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":660}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const code = s.code || '';
const valid = code.length === 6;
return {
code,
nextHref: valid ? 'Countdown2.dc.html' : '#',
boxBorder: s.error && !valid ? '#e5484d' : '#d1d1d1',
onCodeChange: (e) => this.setState({ code: e.target.value.replace(/\D/g, '').slice(0, 6), error: false }),
onSubmit: () => { if (!valid) this.setState({ error: true }); }
};
}
}
</script>
</body>
</html>
