openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: access-key
    description: Access-key verification
  - name: payment-review
    description: Manual payment review for paid access
  - name: pin-review
    description: Manual review of app-issued bot access PINs
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /verify-key:
    post:
      operationId: verifyKey
      tags: [access-key]
      summary: Verify an access key
      description: Checks a submitted key without returning the stored key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyKeyInput"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyVerificationResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyVerificationResult"
        "429":
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyVerificationResult"
        "503":
          description: Verification service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyVerificationResult"
  /payment-review:
    post:
      operationId: createPaymentReviewRequest
      tags: [payment-review]
      summary: Request manual payment review
      description: Sends the submitted email and payment ID to configured Telegram admins for review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentReviewInput"
      responses:
        "202":
          description: Review request queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentReviewCreated"
        "400":
          description: Invalid request or missing consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Telegram review service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /payment-review/{requestId}:
    get:
      operationId: getPaymentReviewStatus
      tags: [payment-review]
      summary: Get payment review status
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current review status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentReviewStatusResult"
        "400":
          description: Invalid request ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Review request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Review service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /pin-review:
    post:
      operationId: createPinReviewRequest
      tags: [pin-review]
      summary: Request bot access PIN review
      description: Sends a user-submitted bot access PIN to configured Telegram admins for manual review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinReviewInput"
      responses:
        "202":
          description: PIN review request queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentReviewCreated"
        "400":
          description: Invalid PIN or missing consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Telegram review service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /pin-review/{requestId}:
    get:
      operationId: getPinReviewStatus
      tags: [pin-review]
      summary: Get bot access PIN review status
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current PIN review status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentReviewStatusResult"
        "400":
          description: Invalid request ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Review request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Review service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    VerifyKeyInput:
      type: object
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - key
    KeyVerificationResult:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
      required:
        - ok
    PaymentReviewInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        paymentId:
          type: string
          minLength: 1
          maxLength: 128
        consent:
          type: boolean
      required:
        - email
        - paymentId
        - consent
    PinReviewInput:
      type: object
      properties:
        pin:
          type: string
          pattern: "^[0-9]{6}$"
        consent:
          type: boolean
      required:
        - pin
        - consent
    PaymentReviewCreated:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending]
      required:
        - requestId
        - status
    PaymentReviewStatusResult:
      type: object
      properties:
        status:
          type: string
          enum: [pending, approved, rejected, expired]
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

